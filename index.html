<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quests">
<meta name="theme-color" content="#07060f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Quest Log</title>
<style>
  :root{
    --bg:#08040a; --card:#14070d; --card2:#1d0b13;
    --red:#ff3a4f; --redline:#7a1a2a; --reddim:#3a0f19;
    --cyan:#3ff0f8; --cyandim:#14565b;
    --yellow:#ffd83a; --green:#6bff8a;
    --text:#ffd9dd; --muted:#a8636d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Bahnschrift","Arial Narrow","Roboto Condensed",-apple-system,"Segoe UI",sans-serif}
  body{
    min-height:100vh;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(255,58,79,.16), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,58,79,.035) 0 1px, transparent 1px 4px),
      var(--bg);
    padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .upper{text-transform:uppercase;letter-spacing:.14em}

  /* top rail */
  .rail{height:2px;background:linear-gradient(90deg,transparent,var(--red) 12%,var(--red) 88%,transparent);box-shadow:0 0 10px var(--red);margin-top:6px}
  nav{display:flex;align-items:center;gap:6px;padding:10px 0 4px}
  .key{flex:none;min-width:24px;height:24px;border:1px solid var(--cyan);color:var(--cyan);font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .tabs{flex:1;display:flex;justify-content:space-between}
  .tab{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:.14em;
    padding:8px 6px;position:relative;cursor:pointer;display:flex;align-items:center;gap:6px}
  .tab svg{width:14px;height:14px}
  .tab.on{color:var(--cyan);text-shadow:0 0 8px rgba(63,240,248,.7)}
  .tab.on::after{content:'';position:absolute;left:4px;right:4px;bottom:0;height:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}

  /* stat strip */
  .stats{display:flex;align-items:center;gap:10px;padding:12px 0 6px}
  .chip{display:flex;align-items:center;gap:6px;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
  .chip b{font-size:20px;letter-spacing:0;font-weight:700}
  .chip.lvl{color:var(--cyan)} .chip.lvl b{border:1px solid var(--cyan);padding:0 8px;line-height:26px}
  .chip.str{color:var(--green)} .chip.str b{border:1px solid var(--green);padding:0 8px;line-height:26px}
  .xp{margin-left:auto;text-align:right;color:var(--red);font-size:13px;letter-spacing:.08em}
  .xp b{font-size:18px;letter-spacing:0}
  .xpbar{height:4px;background:var(--reddim);margin:4px 0 6px;position:relative}
  .xpbar i{display:block;height:100%;background:var(--red);box-shadow:0 0 8px var(--red);transition:width .4s}

  h2{font-size:12px;font-weight:400;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
  h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--redline),transparent)}

  /* cut-corner card with diagonal stroke */
  .card{--line:var(--redline);--cut:14px;position:relative;margin-bottom:12px;padding:14px 16px;background:var(--line);
    clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
  .card::before{content:'';position:absolute;inset:1px;background:linear-gradient(160deg,var(--card2),var(--card));
    clip-path:polygon(0 0,calc(100% - var(--cut) + 1px) 0,100% calc(var(--cut) - 1px),100% 100%,calc(var(--cut) - 1px) 100%,0 calc(100% - var(--cut) + 1px))}
  .card>*{position:relative;z-index:1}
  .card.current{--line:var(--cyan);filter:drop-shadow(0 0 10px rgba(63,240,248,.28))}

  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .qicon{display:inline-flex;width:34px;height:34px;flex:none;filter:drop-shadow(0 0 6px currentColor)}
  .qicon svg{width:100%;height:100%}
  .qicon.main{color:var(--yellow)} .qicon.side{color:var(--cyan)}
  .qicon.sm{width:22px;height:22px}
  .tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  .tag.main{color:var(--yellow)} .tag.side{color:var(--cyan)}
  .now{margin-left:auto;font-size:10px;letter-spacing:.18em;color:#021;background:var(--cyan);padding:2px 7px}
  .qtitle{font-size:21px;font-weight:700;margin:2px 0 2px;text-transform:uppercase;letter-spacing:.04em}
  .prog{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  .meter{display:flex;gap:3px;margin:8px 0 10px}
  .meter i{flex:1;height:4px;background:var(--reddim)}
  .meter i.on{background:var(--red);box-shadow:0 0 6px var(--red)}
  .next{font-size:14px;margin:6px 0 10px;color:var(--muted);border-left:2px solid var(--cyan);padding-left:10px}
  .next b{display:block;color:var(--text);font-size:16px;font-weight:600}

  /* steps as menu rows */
  .step{display:flex;align-items:center;gap:12px;padding:10px 8px;margin:0 -8px;border-top:1px solid rgba(255,58,79,.14);cursor:pointer}
  .step:first-of-type{border-top:0}
  .step:active{background:rgba(255,58,79,.14)}
  .chk{width:22px;height:22px;flex:none;border:1px solid var(--red);display:flex;align-items:center;justify-content:center;color:#08040a;font-size:14px;font-weight:700;background:transparent;padding:0}
  .step.done .chk{background:var(--green);border-color:var(--green)}
  .step.done .txt{color:var(--muted);text-decoration:line-through}
  .txt{flex:1;font-size:15px}

  button{font:inherit;cursor:pointer}
  .btn{background:transparent;color:var(--cyan);border:1px solid var(--cyan);padding:10px 14px;text-transform:uppercase;letter-spacing:.14em;font-size:12px;
    clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
  .btn:not(.solid){clip-path:none}
  .btn.solid{background:var(--cyan);color:#021014;font-weight:700}
  .btn.red{color:var(--red);border-color:var(--red)}
  .btn.ghost{border-color:transparent;color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;margin-top:10px}
  .grow{flex:1}
  .empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;border:1px dashed var(--redline)}

  /* bottom hint bar */
  .bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--bg) 60%,transparent);}
  .bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;border-top:1px solid var(--redline);padding-top:10px}
  .hint{flex:1;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  .hint b{color:var(--cyan);border:1px solid var(--cyandim);padding:0 5px;margin-right:6px;font-weight:400}

  dialog{border:0;background:transparent;color:var(--text);width:min(92vw,520px);padding:0;max-height:90vh;overflow:auto}
  dialog::backdrop{background:rgba(4,0,2,.82)}
  .dlg{--line:var(--cyan)}
  label{font-size:11px;color:var(--muted);display:block;margin:14px 0 6px;letter-spacing:.16em;text-transform:uppercase}
  input,select{font:inherit;width:100%;padding:11px 12px;background:#0b0408;color:var(--text);border:1px solid var(--redline);outline:0;border-radius:0}
  input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 8px rgba(63,240,248,.3)}
  .stepinputs input{margin-bottom:8px}

  .toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140px);background:var(--yellow);color:#201800;
    font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;padding:10px 18px;transition:transform .35s;z-index:99;
    clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
  .toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="wrap">
  <div class="rail"></div>
  <nav>
    <span class="key">1</span>
    <div class="tabs" id="tabs"></div>
    <span class="key">3</span>
  </nav>

  <div class="stats">
    <div class="chip lvl"><span>Level</span><b id="lvl">1</b></div>
    <div class="chip str"><span>Streak</span><b id="streakn">0</b></div>
    <div class="xp"><b id="xpnow">0</b> / <span id="xpneed">100</span> XP</div>
  </div>
  <div class="xpbar"><i id="xpbar" style="width:0%"></i></div>

  <main id="view"></main>
</div>

<div class="bar"><div class="in">
  <div class="hint"><b>TAP</b>step to complete</div>
  <button class="btn solid" id="addBtn">+ New quest</button>
</div></div>

<dialog id="dlg">
  <form method="dialog" id="form" class="card dlg" style="margin:0;--cut:18px">
    <div class="tag main" style="margin-bottom:4px">New quest</div>
    <label for="qname">Quest name</label>
    <input id="qname" placeholder="e.g. Get my apartment organized" required autocomplete="off">
    <label for="qtype">Type</label>
    <select id="qtype">
      <option value="main">Main quest (big goal, 50 XP bonus)</option>
      <option value="side">Side quest (quick win, 15 XP bonus)</option>
    </select>
    <label>Steps (tiny ones work best)</label>
    <div class="stepinputs" id="stepinputs"></div>
    <button type="button" class="btn ghost" id="moreStep">+ add another step</button>
    <div class="row" style="margin-top:14px">
      <button type="button" class="btn red grow" id="cancel">Cancel</button>
      <button type="submit" class="btn solid grow" value="save">Start quest</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  var KEY = 'questlog.v1';
  var state = load();
  var tab = 'current';
  try{ tab = localStorage.getItem('questlog.tab') || 'current'; }catch(e){}

  function load(){
    try{
      var s = JSON.parse(localStorage.getItem(KEY));
      if(s && s.quests) return s;
    }catch(e){}
    return {quests:[], xp:0, streak:0, lastDay:null, currentId:null};
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function today(){ return ymd(new Date()); }
  function yesterday(){ var d=new Date(); d.setDate(d.getDate()-1); return ymd(d); }
  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  // Original quest markers: hex + double chevron (main), diamond + crosshair (side)
  var ICONS = {
    main: '<svg viewBox="0 0 48 48" aria-hidden="true"><polygon points="24,3 42,13.5 42,34.5 24,45 6,34.5 6,13.5" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M13 27l11-10 11 10M13 35l11-10 11 10" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    side: '<svg viewBox="0 0 48 48" aria-hidden="true"><polygon points="24,5 43,24 24,43 5,24" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M24 13v6M24 29v6M13 24h6M29 24h6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="24" r="3" fill="currentColor"/></svg>'
  };
  function qicon(type, small){ return '<span class="qicon '+type+(small?' sm':'')+'">'+ICONS[type]+'</span>'; }

  var TABS = [
    {id:'current', label:'Current'},
    {id:'main',    label:'Main'},
    {id:'side',    label:'Side'},
    {id:'done',    label:'Done'}
  ];

  function levelInfo(xp){
    var lvl=1, need=100, left=xp;
    while(left>=need){ left-=need; lvl++; need+=100; }
    return {lvl:lvl, into:left, need:need};
  }
  function toast(msg){
    var t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},2200);
  }
  function addXP(n, reason){
    var before = levelInfo(state.xp).lvl;
    state.xp += n;
    var after = levelInfo(state.xp).lvl;
    toast(after>before ? 'Level '+after+'  +'+n+' XP' : '+'+n+' XP  '+reason);
  }
  function bumpStreak(){
    var t=today();
    if(state.lastDay===t) return;
    state.streak = (state.lastDay===yesterday()) ? state.streak+1 : 1;
    state.lastDay = t;
  }

  function isDone(q){ return q.steps.length>0 && q.steps.every(function(s){return s.done;}); }
  function nextStep(q){ return q.steps.find(function(s){return !s.done;}); }
  function active(){ return state.quests.filter(function(q){return !q.completed;}); }
  function pickCurrent(){
    var a = active();
    var cur = a.find(function(q){return q.id===state.currentId;});
    if(!cur){ cur = a.find(function(q){return q.type==='main';}) || a[0]; }
    state.currentId = cur ? cur.id : null;
    return cur;
  }

  function toggleStep(qid, sid){
    var q = state.quests.find(function(x){return x.id===qid;});
    var s = q.steps.find(function(x){return x.id===sid;});
    if(s.done){ s.done=false; save(); render(); return; }
    s.done = true;
    bumpStreak();
    addXP(10,'step done');
    if(isDone(q)){
      q.completed = true;
      var bonus = q.type==='main' ? 50 : 15;
      setTimeout(function(){ addXP(bonus,'quest complete'); save(); render(); }, 900);
    }
    save(); render();
  }

  function stepsHTML(q){
    return q.steps.map(function(s){
      return '<div class="step '+(s.done?'done':'')+'" data-q="'+q.id+'" data-s="'+s.id+'">'+
        '<span class="chk">'+(s.done?'✓':'')+'</span><div class="txt">'+esc(s.text)+'</div></div>';
    }).join('');
  }
  function meterHTML(q){
    return '<div class="meter">'+q.steps.map(function(s){return '<i class="'+(s.done?'on':'')+'"></i>';}).join('')+'</div>';
  }

  function questCard(q, isCurrent){
    var done = q.steps.filter(function(s){return s.done;}).length;
    var ns = nextStep(q);
    var h = '<div class="card '+(isCurrent?'current':'')+'">'+
      '<div class="qhead">'+qicon(q.type)+'<span class="tag '+q.type+'">'+(q.type==='main'?'Main quest':'Side quest')+'</span>'+
      (isCurrent?'<span class="now">ACTIVE</span>':'')+'</div>'+
      '<h3 class="qtitle">'+esc(q.name)+'</h3>'+
      '<div class="prog">'+done+' / '+q.steps.length+' steps</div>'+meterHTML(q);
    if(isCurrent && ns){ h += '<div class="next">Next step<b>'+esc(ns.text)+'</b></div>'; }
    h += stepsHTML(q);
    h += '<div class="row">';
    if(!isCurrent) h += '<button class="btn grow" data-focus="'+q.id+'">Set active</button>';
    h += '<button class="btn red" data-del="'+q.id+'">Delete</button></div></div>';
    return h;
  }

  function listHTML(list, emptyMsg, curId){
    return list.length ? list.map(function(q){return questCard(q, q.id===curId);}).join('') : '<div class="empty">'+emptyMsg+'</div>';
  }

  function viewHTML(){
    var cur = pickCurrent();
    var a = active();
    var curId = cur ? cur.id : null;
    if(tab==='current'){
      var h = '<h2 class="upper">Active quest</h2>';
      h += cur ? questCard(cur,true) : '<div class="empty">No active quest<br>Tap + New quest</div>';
      var others = a.filter(function(q){return q!==cur;});
      if(others.length){
        h += '<h2 class="upper">Up next</h2>';
        h += others.map(function(q){
          var d = q.steps.filter(function(s){return s.done;}).length;
          return '<div class="card" style="padding:10px 14px"><div class="qhead" style="margin:0">'+qicon(q.type,true)+
            '<div class="grow"><div class="tag '+q.type+'">'+(q.type==='main'?'Main':'Side')+'</div>'+
            '<div style="font-size:16px;text-transform:uppercase">'+esc(q.name)+'</div>'+
            '<div class="prog">'+d+' / '+q.steps.length+'</div></div>'+
            '<button class="btn" data-focus="'+q.id+'">Set active</button></div></div>';
        }).join('');
      }
      h += '<div class="row"><button class="btn ghost grow" id="notifBtn"></button></div>';
      return h;
    }
    if(tab==='main') return '<h2 class="upper">Main quests</h2>'+listHTML(a.filter(function(q){return q.type==='main';}),'No main quests',curId);
    if(tab==='side') return '<h2 class="upper">Side quests</h2>'+listHTML(a.filter(function(q){return q.type==='side';}),'No side quests',curId);
    var dn = state.quests.filter(function(q){return q.completed;});
    return '<h2 class="upper">Completed</h2>'+(dn.length ? dn.map(function(q){
      return '<div class="card" style="padding:10px 14px"><div class="qhead" style="margin:0">'+qicon(q.type,true)+
        '<div class="grow"><div class="tag '+q.type+'">'+(q.type==='main'?'Main':'Side')+'</div><div style="text-transform:uppercase">'+esc(q.name)+'</div></div>'+
        '<button class="btn red" data-del="'+q.id+'">Remove</button></div></div>';
    }).join('') : '<div class="empty">Nothing completed yet</div>');
  }

  function renderTabs(){
    document.getElementById('tabs').innerHTML = TABS.map(function(t){
      return '<button class="tab '+(t.id===tab?'on':'')+'" data-tab="'+t.id+'">'+t.label+'</button>';
    }).join('');
  }

  function render(){
    var li = levelInfo(state.xp);
    document.getElementById('lvl').textContent = li.lvl;
    document.getElementById('xpnow').textContent = li.into;
    document.getElementById('xpneed').textContent = li.need;
    document.getElementById('xpbar').style.width = Math.round(li.into/li.need*100)+'%';
    var live = state.lastDay===today() || state.lastDay===yesterday();
    document.getElementById('streakn').textContent = live ? state.streak : 0;
    renderTabs();
    document.getElementById('view').innerHTML = viewHTML();
    notifLabel();
    updateBadge(pickCurrent());
  }

  function updateBadge(cur){
    try{
      if(navigator.setAppBadge){
        var n = cur ? cur.steps.filter(function(s){return !s.done;}).length : 0;
        if(n>0) navigator.setAppBadge(n); else navigator.clearAppBadge();
      }
    }catch(e){}
  }

  document.body.addEventListener('click', function(e){
    var el = e.target.closest('[data-tab],[data-q],[data-focus],[data-del],#notifBtn');
    if(!el) return;
    if(el.dataset.tab){
      tab = el.dataset.tab;
      try{ localStorage.setItem('questlog.tab', tab); }catch(err){}
      render(); window.scrollTo(0,0);
    } else if(el.dataset.q){ toggleStep(el.dataset.q, el.dataset.s); }
    else if(el.dataset.focus){ state.currentId=el.dataset.focus; tab='current'; save(); render(); window.scrollTo(0,0); }
    else if(el.dataset.del){
      if(confirm('Delete this quest?')){
        state.quests = state.quests.filter(function(q){return q.id!==el.dataset.del;});
        save(); render();
      }
    } else if(el.id==='notifBtn'){ askNotif(); }
  });

  // --- New quest dialog ---
  var dlg = document.getElementById('dlg');
  var stepWrap = document.getElementById('stepinputs');
  function addStepInput(){
    var i = document.createElement('input');
    i.placeholder = 'Step '+(stepWrap.children.length+1);
    i.autocomplete='off';
    stepWrap.appendChild(i);
  }
  document.getElementById('addBtn').onclick = function(){
    document.getElementById('qname').value='';
    stepWrap.innerHTML=''; addStepInput(); addStepInput(); addStepInput();
    dlg.showModal();
  };
  document.getElementById('moreStep').onclick = addStepInput;
  document.getElementById('cancel').onclick = function(){ dlg.close(); };
  document.getElementById('form').addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('qname').value.trim();
    if(!name) return;
    var steps = Array.prototype.map.call(stepWrap.children, function(i){return i.value.trim();})
      .filter(Boolean).map(function(t){return {id:uid(), text:t, done:false};});
    if(!steps.length) steps=[{id:uid(), text:'Get started', done:false}];
    var q = {id:uid(), name:name, type:document.getElementById('qtype').value, steps:steps, completed:false};
    state.quests.push(q);
    if(!state.currentId || q.type==='main' && !active().some(function(x){return x.id===state.currentId && x.type==='main';})) state.currentId=q.id;
    save(); dlg.close(); render();
  });

  // --- Notifications ---
  // iOS only allows these for web apps installed to the Home Screen, and a plain
  // web app can't schedule one while closed (that needs a push server).
  // The button asks permission and sends the current quest on demand.
  function notifLabel(){
    var nb = document.getElementById('notifBtn'); if(!nb) return;
    if(!('Notification' in window)){ nb.textContent='Notifications need Add to Home Screen (iOS 16.4+)'; return; }
    nb.textContent = Notification.permission==='granted' ? 'Notifications on. Tap to send a test' : 'Turn on notifications';
  }
  function askNotif(){
    if(!('Notification' in window)){ alert('On iPhone, first use Share, Add to Home Screen, then open the app from your Home Screen.'); return; }
    Notification.requestPermission().then(function(p){
      notifLabel();
      if(p==='granted') sendQuestNotification();
    });
  }
  function sendQuestNotification(){
    var cur = pickCurrent(); if(!cur) return;
    var ns = nextStep(cur);
    var title = cur.name;
    var body = ns ? 'Next step: '+ns.text : 'Quest ready to finish';
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){ reg.showNotification(title,{body:body,icon:'icon-192.png',tag:'current-quest'}); });
    }
  }

  document.addEventListener('visibilitychange', function(){ if(!document.hidden) render(); });
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
  render();
})();
</script>
</body>
</html>
